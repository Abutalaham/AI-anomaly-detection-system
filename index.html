<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sentinel watches your live data, spots what's abnormal in seconds, and tells you why." />
    <title>Sentinel | Real-Time Anomaly Detection</title>
    <!-- Preconnect Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Pre-paint script to prevent theme flashing -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('sentinel-ui-storage');
          let theme = 'dark';
          if (stored) {
            const parsed = JSON.parse(stored);
            if (parsed && parsed.state && parsed.state.theme) {
              theme = parsed.state.theme;
            }
          }
          const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground min-h-screen antialiased selection:bg-accent-cyan/20 selection:text-accent-cyan">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
